apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: express-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/kurosawa-kuro/k8s-ubuntu-kind-api-01-2-basic-ingress-argo-cd.git"
    targetRevision: HEAD
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true